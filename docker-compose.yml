name: kologram

# Full stack: Postgres, Redis, RabbitMQ + auth / market / chat / admin / notifications.
# Optional MailHog: docker compose --profile mail up -d
#
# Chat schema is applied once by chat_schema_init (reads schema.sql from the repo).

services:
  # ---------------------------------------------------------------------------
  # Infrastructure
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-databases.sh:/docker-entrypoint-initdb.d/01-init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 15

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 15

  mailhog:
    image: mailhog/mailhog:v1.0.1
    profiles: ["mail"]
    ports:
      - "1025:1025"
      - "8025:8025"

  # ---------------------------------------------------------------------------
  # Application services
  # ---------------------------------------------------------------------------
  auth_service:
    build:
      context: .
      dockerfile: auth_service/Dockerfile
    image: kologram-auth_service
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      APP_NAME: KologramAuth
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/auth
      REDIS_ENABLED: "true"
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_ENABLED: "true"
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      RABBITMQ_EXCHANGE: auth.events
      AUTH_PRIVATE_KEY_PATH: /app/auth_service/keys/private.pem
      AUTH_PUBLIC_KEY_PATH: /app/auth_service/keys/public.pem
    volumes:
      - ./auth_service/keys:/app/auth_service/keys:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  market_service:
    build:
      context: .
      dockerfile: market_service/Dockerfile
    image: kologram-market_service
    restart: unless-stopped
    ports:
      - "8002:8002"
    environment:
      APP_NAME: KologramMarket
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/market
      RABBITMQ_ENABLED: "true"
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      RABBITMQ_EXCHANGE: listing.events
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # Apply chat DDL once (service has no migration runner).
  chat_schema_init:
    image: postgres:16-alpine
    restart: "no"
    environment:
      PGPASSWORD: postgres
    volumes:
      - ./chat_service/internal/infrastructure/persistence/postgres/schema.sql:/schema.sql:ro
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        until pg_isready -h postgres -U postgres; do sleep 1; done
        psql -h postgres -U postgres -d chat -v ON_ERROR_STOP=1 -f /schema.sql
        echo "chat schema applied"
    depends_on:
      postgres:
        condition: service_healthy

  chat_service:
    build:
      context: ./chat_service
      dockerfile: Dockerfile
    image: kologram-chat_service
    restart: unless-stopped
    ports:
      - "8003:8080"
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/chat?sslmode=disable
      MARKET_SERVICE_URL: http://market_service:8002
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      RABBITMQ_EXCHANGE: chat.events
      EVENT_PUBLISHER: rabbitmq
      MARKET_HTTP_TIMEOUT: 5s
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      market_service:
        condition: service_healthy
      chat_schema_init:
        condition: service_completed_successfully

  admin_service:
    build:
      context: .
      dockerfile: admin_service/Dockerfile
    image: kologram-admin_service
    restart: unless-stopped
    ports:
      - "8004:8004"
    environment:
      APP_ENV: development
      DJANGO_SECRET_KEY: dev-docker-admin-secret-change-me
      ALLOWED_HOSTS: "*"
      ADMIN_DB_URL: postgresql://postgres:postgres@postgres:5432/admin
      AUTH_DB_URL: postgresql://postgres:postgres@postgres:5432/auth
      MARKET_DB_URL: postgresql://postgres:postgres@postgres:5432/market
    depends_on:
      postgres:
        condition: service_healthy
      auth_service:
        condition: service_started
      market_service:
        condition: service_started


  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    image: kologram-gateway
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      HTTP_ADDR: ":8000"
      AUTH_SERVICE_URL: http://auth_service:8001
      MARKET_SERVICE_URL: http://market_service:8002
      CHAT_SERVICE_URL: http://chat_service:8080
      AUTH_PUBLIC_KEY_PATH: /keys/public.pem
      CORS_ORIGIN: http://localhost:3030
    volumes:
      - ./auth_service/keys/public.pem:/keys/public.pem:ro
    depends_on:
      auth_service:
        condition: service_healthy
      market_service:
        condition: service_healthy
      chat_service:
        condition: service_started

  notification_dispatcher:
    build:
      context: .
      dockerfile: notification_dispatcher/Dockerfile
    image: kologram-notification_dispatcher
    restart: unless-stopped
    environment:
      APP_NAME: notification_dispatcher
      APP_ENV: development
      LOG_LEVEL: INFO
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      RABBITMQ_EXCHANGES: auth.events,listing.events,chat.events
      RABBITMQ_QUEUE: notification.dispatcher
      RABBITMQ_PREFETCH: "10"
      EMAIL_ENABLED: "false"
      EMAIL_FROM: noreply@kologram.local
      SMTP_HOST: mailhog
      SMTP_PORT: "1025"
      SMTP_USER: ""
      SMTP_PASSWORD: ""
      SMTP_USE_TLS: "false"
      SMTP_USE_SSL: "false"
      EMAIL_MAX_ATTEMPTS: "3"
      IDEMPOTENCY_DB_PATH: /app/data/idempotency.sqlite3
    volumes:
      - notification_data:/app/data
    depends_on:
      rabbitmq:
        condition: service_healthy
      auth_service:
        condition: service_started

volumes:
  postgres_data:
  notification_data:
